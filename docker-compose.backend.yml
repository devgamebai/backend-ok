  # ---------------------------------------------------------------------------
  # WSPay - Wallet & exchange service (game currency ↔ VIN transfers)
  # ---------------------------------------------------------------------------
  # Port 18081 (HTTP), 8643 (HTTPS)
  # Handles: money exchange between game wallets and main wallet
  # ---------------------------------------------------------------------------
  # WSPay - DISABLED (not running on production)
  # wspay:
  #   image: eclipse-temurin:8-jre
  #   container_name: sunwinkr-wspay
  #   command: >
  #     java -Xmx256m -Xms128m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
  #     -cp "libs/*:api/wspay/libs/*:api/wspay/build/libs/wspay-1.0.jar"
