<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SunwinKR API — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "none",
        persistAuthorization: true,
        tagsSorter: (a, b) => {
          if (a === "login") return -1;
          if (b === "login") return 1;
          return a.localeCompare(b);
        },
        requestInterceptor: (req) => {
          req.url = req.url.replace(/\/api_backend\/c\/\d+(?=[?&]|$)/, "/api_backend");
          req.url = req.url.replace(/\/api\/c\/\d+(?=[?&]|$)/, "/api");
          return req;
        },
      });
    };
  </script>
</body>
</html>
