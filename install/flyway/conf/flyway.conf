# Flyway Configuration
# Credentials are injected via environment variables at runtime
flyway.url=jdbc:mysql://${MYSQL_HOST:-mysql}:3306/?useSSL=false&allowPublicKeyRetrieval=true
flyway.user=${MYSQL_USER:-root}
flyway.password=${MYSQL_PASSWORD}
flyway.locations=filesystem:/flyway/sql
flyway.schemas=vinplay,vinplay_minigame,vinplay_admin,vinplay_gamebai
flyway.defaultSchema=vinplay
flyway.table=schema_migrations
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.outOfOrder=true
flyway.placeholderReplacement=false
flyway.connectRetries=10
flyway.connectRetriesInterval=5
