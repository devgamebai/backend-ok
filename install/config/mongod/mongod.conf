# Where and how to store data.
storage:
  wiredTiger:
    engineConfig:
        # 4 → 2 (2026-04-28): WT cache must be < container memory limit
        # minus headroom for connections + indexes + network. Container is
        # 6G; 2G cache leaves 4G for JDBC connections (~200 × 5MB), audit-bot
        # scan buffers, indexes, and growth. Mongo was OOM-killed 188 times
        # because the previous 4G cache target exceeded the 2G container
        # limit. See docker-compose.database.yml mongodb deploy.resources.
        cacheSizeGB: 2