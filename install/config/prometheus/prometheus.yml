global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: sunwinkr-prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: redis
    static_configs:
      - targets: ['sunwinkr-redis-exporter:9121']

  - job_name: mysql
    static_configs:
      - targets: ['sunwinkr-mysqld-exporter:9104']
