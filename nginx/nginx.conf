worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 128M;
    server_tokens off;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # --- Rate Limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    # Docker internal DNS resolver - allows nginx to start even when upstream
    # containers are not yet running (defers resolution per-request instead of at startup)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # --- Upstreams (commented out - using resolver-based variables in server blocks instead) ---
    # upstream admin_php { server admin-php:9000; }
    # upstream agency_php { server agency-php:9000; }
    # upstream portal_api { server portal-api:8081; }
    # upstream backend_api { server backend-api:8082; }
    # upstream payment_api { server payment-api:28081; }

    # --- Include site configs ---
    include /etc/nginx/conf.d/*.conf;
}
