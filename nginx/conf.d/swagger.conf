# =============================================================================
# Swagger UI proxy — bridges synthetic /c/{id} paths to real ?c=<id> calls
# =============================================================================
# Used by docker-compose.swagger.yml. Listens on container port 80, exposed
# at host 127.0.0.1:8087 by the compose file. Joins the sunwinkr-backend
# network so it can reach backend-api:19082 and portal-api:8081 by service
# name.
#
# The OpenAPI spec uses synthetic paths like /api_backend/c/31 because real
# `?c=<id>` cannot appear in OpenAPI 3.0 path templates. This server rewrites
# them back to the real form before proxying to the Java APIs:
#
#   POST /api_backend/c/31?c=31&aat=...   →   POST /api_backend?c=31&aat=...
#   POST /api/c/3?c=3&un=foo&pw=bar       →   POST /api?c=3&un=foo&pw=bar
#
# `nginx` keeps `$args` unchanged across `rewrite`, so the existing
# `?c=N&aat=...` query string survives the path strip — no manual reassembly.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    # ---- Swagger UI static assets ----
    location /swagger/ {
        alias /var/www/swagger/;
        index index.html;
        location ~ /swagger/openapi\.json$ {
            alias /var/www/swagger/openapi.json;
            add_header Cache-Control "no-cache" always;
        }
    }

    # ---- Synthetic backend path: /api_backend/c/<id> → real /api_backend ----
    location ~ ^/api_backend/c/\d+$ {
        rewrite ^/api_backend/c/\d+$ /api_backend break;
        proxy_pass http://backend-api:19082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Synthetic portal path: /api/c/<id> → real /api ----
    location ~ ^/api/c/\d+$ {
        rewrite ^/api/c/\d+$ /api break;
        proxy_pass http://portal-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Direct passthrough for callers using the real URL pattern ----
    location /api_backend {
        proxy_pass http://backend-api:19082;
        proxy_set_header Host $host;
    }
    # /api_agent shares the same backend container but bypasses the admin-token
    # filter (see VinPlayBackendMain.java — `isBackendEndpoint` is false for
    # /api_agent). Used by sunkr-agency-next for rc-gated commands like c=9973.
    location /api_agent {
        proxy_pass http://backend-api:19082;
        proxy_set_header Host $host;
    }
    location = /api {
        proxy_pass http://portal-api:8081;
        proxy_set_header Host $host;
    }

    # ---- Redirect bare / to /swagger/ ----
    location = / {
        return 302 /swagger/;
    }
}
