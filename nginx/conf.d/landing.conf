# Landing Page — sunkr.club
server {
    listen 80;
    server_name sunkr.club www.sunkr.club;

    root /var/www/landing;
    index index.html;

    # Static assets — aggressive cache
    location ~* \.(png|webp|jpg|jpeg|gif|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML — short cache
    location / {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok";
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
    }
}
