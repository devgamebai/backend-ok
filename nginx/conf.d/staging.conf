    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    server_name agency-staging.sunkr.bet agency-staging.sunkr.club;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $nextagency sunkr-nextagency:3000;
