# =============================================================================
# STAGING PLAY — staging-play.sunkr.bet
# =============================================================================
# Game client (WebView) + Portal API + WebSocket bridge
# =============================================================================

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    server_name staging-play.sunkr.bet staging-play.sunkr.club;

    root /var/www/webbuild;
    index index.html;

    add_header X-Server-Block "play" always;
    resolver 127.0.0.11 valid=30s;

    location /health {
        access_log off;
        return 200 "ok";
    }

    # --- Spring minigame-api (TaiXiu + Sicbo) ---
    # /api/v2/{taixiu,sicbo,admin/taixiu,admin/sicbo}/* must match BEFORE the
    # generic /api block, otherwise nginx routes the v2 prefix to portal-api.
    location ~ ^/api/v2/(taixiu|sicbo|admin/taixiu|admin/sicbo)/ {
        set $minigame_api minigame-api:9290;
        proxy_pass http://$minigame_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Spring minigame-api — STOMP WebSocket ---
    location /ws/minigame {
        set $minigame_api minigame-api:9290;
        proxy_pass http://$minigame_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # --- Spring lottery-api — REST ---
    # Service name in docker-compose.offline-games.yml is `lottery-spring-api`
    # (the legacy Node XSMB scraper still owns `lottery-api`); the upstream
    # host below MUST match the new service name.
    location ~ ^/api/v2/lottery/ {
        set $lottery_api lottery-spring-api:9292;
        proxy_pass http://$lottery_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Spring lottery-api — STOMP WebSocket ---
    location /ws/lottery {
        set $lottery_api lottery-spring-api:9292;
        proxy_pass http://$lottery_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Portal API
    location /api {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GSC+ Seamless Wallet callbacks (balance, withdraw, deposit, rollback, cancel, transfer, pushbetdata)
    location /gsc/ {
        set $thirdparty game-thirdparty:9591;
        proxy_pass http://$thirdparty;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GSC+ Player API (launch game, list games)
    location /gsc-api/ {
        set $thirdparty_api game-thirdparty:9590;
        proxy_pass http://$thirdparty_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AWC Seamless Wallet callback. Provider POSTs JSON to /awc/callback;
    # rewrite into portal-api processor c=3097 (AwcCallbackProcessor).
    location = /awc/callback {
        set $portal portal-api:8081;
        rewrite ^.*$ /api?c=3097 break;
        proxy_pass http://$portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket balance push (portal-api direct, not via ws-bridge)
    location /ws/balance {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # WebSocket bridge
    location /ws/ {
        set $bridge ws-bridge:8089;
        proxy_pass http://$bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # BanCa WebSocket
    location /ws/banca {
        set $gs banca:2083;
        proxy_pass http://$gs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Static game files
    location / {
        add_header X-Server-Block "play" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }
}

# =============================================================================
# MINIGAME WEBSOCKET (via ws-bridge)
# =============================================================================

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    server_name
        wmini.staging-play.sunkr.bet         wmini.staging-play.sunkr.club
        wmini2.staging-play.sunkr.bet        wmini2.staging-play.sunkr.club
        wminipoker.staging-play.sunkr.bet    wminipoker.staging-play.sunkr.club
        wtrenduoi.staging-play.sunkr.bet     wtrenduoi.staging-play.sunkr.club
        wbaucua.staging-play.sunkr.bet       wbaucua.staging-play.sunkr.club
        wtaixiu.staging-play.sunkr.bet       wtaixiu.staging-play.sunkr.club
        wsicbo.staging-play.sunkr.bet        wsicbo.staging-play.sunkr.club
        overunder.staging-play.sunkr.bet     overunder.staging-play.sunkr.club;

    resolver 127.0.0.11 valid=30s;
    add_header X-Server-Block "minigame-ws" always;

    # FE uses MiniGameNetworkClient singleton via wmini, so all minigame aliases
    # should follow the same bridge path and handler normalization.
    location / {
        set $bridge ws-bridge:8089;
        proxy_pass http://$bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

