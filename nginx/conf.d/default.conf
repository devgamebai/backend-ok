# =============================================================================
# SUNWINKR - Admin Panel + Default
# =============================================================================

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    server_name panel-7fq.danisa.app;
    resolver 127.0.0.11 valid=30s;

    add_header X-Server-Block "admin" always;

    location /health {
        access_log off;
        return 200 "ok";
    }

    # --- Java Backend APIs (highest priority) ---
    location /api_backend {
        set $backend backend-api:19082;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api_agent {
        set $backend backend-api:19082;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Portal API (player-facing, /api?c=...)
    # Must be exact prefix match to avoid catching /api/auth (Next.js)
    location = /api {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Static files ---
    location /public/ {
        alias /var/www/admin/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /cdn/ { alias /var/www/cdn/; expires 30d; }
    location /upload/ { alias /var/www/upload/; expires 30d; }
    location /taixiu/ { alias /var/www/taixiu/; index live_game.html; }

    # --- Legacy PHP admin at /cms ---
    location /cms {
        set $admin sunkr-admin-nginx:80;
        rewrite ^/cms(/.*)$ $1 break;
        rewrite ^/cms$ / break;
        proxy_pass http://$admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- API documentation (Swagger UI) ---
    location /swagger/ {
        alias /var/www/swagger/;
        index index.html;
        # Force fresh fetch of the spec — Swagger UI caches aggressively otherwise.
        location ~ /swagger/openapi\.json$ {
            alias /var/www/swagger/openapi.json;
            add_header Cache-Control "no-cache" always;
        }
    }

    # --- Next.js Admin CMS (catch-all default) ---
    # Handles: /, /login, /admin/*, /deposit, /reports/*, /api/auth, /_next, etc.
    location / {
        set $admin_next sunkr-admin-next:3000;
        proxy_pass http://$admin_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(ht|git|env) { deny all; }
}
