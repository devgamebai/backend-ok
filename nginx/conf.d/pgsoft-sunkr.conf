# SUN-XXXX — pgsoft-sunkr.live serves PG Soft inline-HTML launchers
# by token. Mobile clients open the launch URL in a new tab and
# can't render inline HTML, so LaunchGSCGameProcessor stashes the HTML
# in Hazelcast keyed by a UUID token and returns
# https://pgsoft-sunkr.live/p/{token}. This server block proxies that
# URL to portal-api?c=3092&t={token}, which writes the cached HTML.

server {
    listen 80;
    server_name pgsoft-sunkr.live;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 2606:4700::/32;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=30s;

    # /p/{token} → portal-api c=3092 returns text/html
    location ~ ^/p/([a-zA-Z0-9]{1,64})$ {
        set $portal portal-api:8081;
        proxy_pass http://$portal/api?c=3092&t=$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # All other paths: 404. The launcher HTML loads its own assets from
    # PG Soft's rotating CDNs (m.x1skf.com, etc.) so we don't proxy
    # those — the iOS webview hits them directly.
    location / {
        return 404;
    }
}
