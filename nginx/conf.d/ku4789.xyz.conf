# =============================================================================
# Game client (WebView) + Portal API + WebSocket bridge
# =============================================================================
server {
    listen 80;
    server_name ku4789.xyz;
resolver 127.0.0.11 valid=30s;

    location /ws/balance {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }
}

server {
    listen 80;
    server_name play.ku4789.xyz;

    root /var/www/webbuild;
    index index.html;

    add_header X-Server-Block "play" always;
    resolver 127.0.0.11 valid=30s;

    location /health {
        access_log off;
        return 200 "ok";
    }

    # Portal API
    location /api {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GSC+ Seamless Wallet callbacks (balance, withdraw, deposit, rollback, cancel, transfer, pushbetdata)
    location /gsc/ {
        set $thirdparty game-thirdparty:9591;
        proxy_pass http://$thirdparty;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GSC+ Player API (launch game, list games)
    location /gsc-api/ {
        set $thirdparty_api game-thirdparty:9590;
        proxy_pass http://$thirdparty_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AWC Seamless Wallet callback. Provider POSTs JSON to /awc/callback;
    # rewrite into portal-api processor c=3097 (AwcCallbackProcessor).
    location = /awc/callback {
        set $portal portal-api:8081;
        rewrite ^.*$ /api?c=3097 break;
        proxy_pass http://$portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket balance push (portal-api direct, not via ws-bridge)
    location /ws/balance {
        set $portal portal-api:8081;
        proxy_pass http://$portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # WebSocket bridge
    location /ws/ {
        set $bridge ws-bridge:8089;
        proxy_pass http://$bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # BanCa WebSocket
    location /ws/banca {
        set $gs banca:2083;
        proxy_pass http://$gs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Static game files
    location / {
        add_header X-Server-Block "play" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }
}

# =============================================================================
# MINIGAME WEBSOCKET (via ws-bridge)
# =============================================================================

server {
    listen 80;
    server_name
        wmini.ku4789.xyz
        wmini2.ku4789.xyz
        wminipoker.ku4789.xyz
        wtrenduoi.ku4789.xyz
        wbaucua.ku4789.xyz
        wtaixiu.ku4789.xyz
        wsicbo.ku4789.xyz
        overunder.ku4789.xyz;

    resolver 127.0.0.11 valid=30s;
    add_header X-Server-Block "minigame-ws" always;

    # FE uses MiniGameNetworkClient singleton via wmini, so all minigame aliases
    # should follow the same bridge path and handler normalization.
    location / {
        set $bridge ws-bridge:8089;
        proxy_pass http://$bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

