  # # ---------------------------------------------------------------------------
  # # ws-bridge — WebSocket JSON↔Binary translation for browser clients
  # # ---------------------------------------------------------------------------
  # # GitLab #34: previously lived in docker-compose.staging.yml behind the
  # # CLOUDFLARE_TUNNEL_TOKEN flag. That meant a `./deploy.sh --rebuild`
  # # without the tunnel enabled would pre-stop ws-bridge (name-filter
  # # matches every sunwinkr-*) but never recreate it — taking down all
  # # player-facing game WebSockets. Moving it into games.yml keeps it
  # # next to the game services it bridges, and guarantees compose always
  # # knows how to recreate it.
  ws-bridge:
    build:
      context: ./ws-bridge
      dockerfile: Dockerfile
    container_name: sunwinkr-ws-bridge
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ws-bridge/bridge.js:/app/bridge.js:ro
      - ./logs/ws-bridge:/app/logs
    networks:
      - frontend
      - gameservers
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

