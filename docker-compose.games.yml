# =============================================================================
# GAME SERVERS (Java)
# =============================================================================
# All game servers (card games, dice games, slots, minigames)
#
# All modules build from source (backend-master/).
# Source: Slot, Minigame, TLMN, XocDia, BaCay, Poker, PokerTour,
#         Lieng, Binh, BaiCao, Sam, Caro, CoTuong, Coup, XiZach, ThirdParty
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.database.yml -f docker-compose.games.yml up -d
# =============================================================================

x-game-base: &game-base
  build:
    context: ./backend-master
    dockerfile: Dockerfile
  restart: unless-stopped
  # SUN-1034: games write to MongoDB (game log), Hazelcast (session state),
  # and hold live player sockets. 30s lets the BitZero loop drain sessions
  # and flush the tail of the write queue before SIGKILL.
  stop_grace_period: 30s
  # SUN-1035: enroll every game in autoheal. Docker Compose only restarts
  # on process exit; this label tells the autoheal sidecar to also restart
  # containers reporting unhealthy (stalled game loops, frozen JVM, etc).
  labels:
    autoheal: "true"
  working_dir: /app
  env_file: [.env]
  entrypoint: ["/app/entrypoint.sh"]
  depends_on:
    mysql:
      condition: service_healthy
    hazelcast-1:
      condition: service_healthy
  volumes:
    - ./logs:/app/logs
  networks:
    - gameservers
    - frontend
    - database
    - messaging
  # P2: game-loop liveness healthcheck. GameHealthServer.tick() stamps
  # the loop heartbeat; /health returns 503 if tick is >90s stale. After 3
  # consecutive failures compose auto-restarts the container → game loop
  # recovers without manual intervention. start_period gives BitZero time
  # to finish module init before the first probe.
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:${GAME_HEALTH_PORT:-8888}/health > /dev/null || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s
  deploy:
    resources:
      limits:
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  # ===========================================================================
  # GAME SERVERS (all built from source)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Slot Machine - Multiple slot game variants
  # ---------------------------------------------------------------------------
  game-slot:
    <<: *game-base
    container_name: sunwinkr-game-slot
    command: >
      java -Xmx512m -Xms256m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      -Dservice.name=game-slot
      -Dlogback.configurationFile=/app/game/slot/config/logback.xml
      -cp "libs/runtime/*:libs/app/*"
      game.SlotMain
    # TCP: 1843, Admin: 16070
    ports:
      - "11843:1843"
      - "11844:1844"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # XocDia Tứ Linh (4 Divine Beasts) - Dedicated server
  # ---------------------------------------------------------------------------
  # TCP: 1650 | WS: 1651
  # Isolated from minigame server — no TàiXỉu/Sicbo broadcast noise
  # ---------------------------------------------------------------------------
  game-xocdiatulinh:
    <<: *game-base
    container_name: sunwinkr-game-xocdiatulinh
    command: >
      java -Xmx512m -Xms256m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      -Dservice.name=game-xocdiatulinh
      -Dlogback.configurationFile=/app/game/xocdiatulinh/config/logback.xml
      -cp "libs/runtime/*:libs/app/*"
      game.xocdia.XocdiaMain
    # XocDia Tứ Linh uses same ports as normal XocDia (2343/2344) but different container
    ports:
      - "12543:2343"
      - "12544:2344"

  # ---------------------------------------------------------------------------
  # Minigame - MiniPoker, Bau Cua, Tai Xiu, Cao Thap, Sicbo, Galaxy
  # ---------------------------------------------------------------------------
  # TCP: 1643 | Jetty Admin: 16072
  # Contains the fund/balance system for most minigames
  # ---------------------------------------------------------------------------
  game-minigame:
    <<: *game-base
    container_name: sunwinkr-game-minigame
    extra_hosts:
      - "localhost:host-gateway"
    command: >
      java -Xmx512m -Xms256m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      -Dservice.name=game-minigame
      -Dlogback.configurationFile=/app/game/Minigame/config/logback.xml
      -cp "libs/app/*:libs/runtime/*"
      game.MiniGameMain
    # TCP: 1643, Admin: 16072
    ports:
      - "11640:1640"
      - "11641:1641"
    deploy:
      resources:
        limits:
          memory: 1G

