plugins {
    id 'java'
}

group 'com.vingame'
version '1.0-SNAPSHOT'
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'
sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {  
    testCompile group: 'junit', name: 'junit', version: '4.10'    
    compile project(':VbeeCommon')
	implementation 'com.google.code.gson:gson:2.9.0'
    compile project(':VinPlayDAL')
    // SUN-1171 follow-up: see BitzeroAll/build.gradle. Stale internal-project
    // jars in libs/ shadow the in-tree compiled classes.
    compile fileTree(
        include: ['*.jar'],
        exclude: [
            'VbeeCommon-*.jar',
            'VinPlayDAL-*.jar',
            'VinPlayUserCore-*.jar',
            'VinPlayCardLib-*.jar',
            'CardCoreLib-*.jar',
            'BitzeroAll-*.jar',
            'BitZeroMinigame-*.jar',
            'BitzeroMini-*.jar'
        ],
        dir: '../libs'
    )
}

sourceSets {
    main {
        java {
            exclude '**/scribe/**'
            exclude '**/logcontroller/**'
        }
    }
}
