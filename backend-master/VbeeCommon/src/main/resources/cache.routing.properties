# =============================================================================
# Per-IMap routing flag for the Hazelcast→Redis cache migration.
# See docs/architecture/HAZELCAST_TO_REDIS_PLAN.md for the full plan.
#
# Format:   cache.<map-name> = hazelcast | redis
# Default:  hazelcast
#
# Phase 4 wave order (smallest → largest, see imap-inventory CSV):
#   Wave 1 — single-call-site maps         | flip in batches of 5–10/day
#   Wave 2 — 2–4 call-site maps            | flip 1/day with smoke test
#   Wave 3 — cacheToken + listener-bound   | 1-week dual-read soak each
#   Wave 4 — users (wallet)                | full dual-write soak
#
# Roll forward = flip a line, restart the affected service.
# Rollback     = flip the same line back, restart.
# Hazelcast keeps running until Phase 8 (decommission), so rollback is
# always instant.
# =============================================================================

cache.default = hazelcast

# ─── Wave 1 (LOW criticality, single-call-site maps) ─────────────────────────
# Migration tracker — flip individual entries during Phase 4 Wave 1.
#
# 2026-05-07: Phase 4 Wave 1 — first cutover (SUN-1248).
# To rollback any line, change `redis` to `hazelcast` and restart.
cache.bannerCache         = redis
# 2026-05-07: Wave 1 batch 2 (5 maps, all lock-free, all single-or-double call site)
cache.companyBankCache    = redis
cache.cacheHisTLMN        = redis
cache.cacheHisXD          = redis
cache.cacheLogPortal      = redis
cache.cache_device_fp     = redis
# 2026-05-07: Wave 1 batch 3 (5 lock-free maps, backend-api focused)
cache.cacheBanChat        = redis
cache.cacheAgentCode      = redis
# cacheGameRtp ROLLBACK 2026-05-07: hidden cross-container reader in
# VbeeCommon RtpResolver (loaded by every game server). Game servers
# weren't rebuilt for this batch, so flipping cacheGameRtp to Redis
# would break admin→game RTP propagation. Re-flip in a future batch
# that also rebuilds the game-server containers.
cache.cacheGameRtp        = redis
cache.cacheSetUserWinRate = redis
cache.agencySessions      = redis
# 2026-05-07: Wave 1 batch 4 (2 maps — only safe non-game/non-vbee left
# without lock-site triage). Remaining maps need either game-server
# rebuild, vbee rebuild, or lock-site human read before flipping.
cache.cacheAgentOtp       = redis
cache.cacheResultMiniGame = redis
# 2026-05-07: Wave 1 batch 5 (game-server batch — RTP + slot force-result)
# These maps are read by game/Minigame and game/slot via VbeeCommon and
# game-side helpers, so the batch requires rebuilding all game-server
# images alongside backend-api.
cache.cacheUserRtpOverride = redis
cache.cacheForceResult     = redis
# 2026-05-07: Wave 1 batch 6 (vbee batch — wallet-history visibility)
# Requires vbee container rebuild because LogMoneyUserExtraProcessor
# (the writer side) lives in api/vbee.
cache.cacheTransaction     = redis
# 2026-05-07: Wave 1 batch 7 — three "lock-flagged but no-actual-lock-on-this-map"
# maps. Audit script v2 marked them as LOCK because the file contains .lock(...)
# calls, but those locks are on DIFFERENT IMaps (e.g. captchaCache file also
# locks userMap; cacheApiOtp file locks the right one but not on cacheCaptcha).
# Verified by inspection of every .lock(...) call site.
cache.telegramOtpCache    = redis
cache.cacheCaptcha        = redis
cache.cacheUsersPlayGame  = redis
# 2026-05-07: Wave 1 batch 8 — backend-only maps (no game-server use).
# Excludes maps in shared services (TaiXiuServiceImpl, UserServiceImpl)
# that game-minigame would also need rebuilt for to avoid split-brain.
cache.failed_2fa_attempts = redis
cache.mapCheckCCU         = redis
# 2026-05-07: Wave 1 batch 9 (game-server batch #2). Requires game-minigame
# rebuild because TaiXiuMD5ServiceImpl + UserServiceImpl are loaded there.
cache.jackpottaixiumd5    = redis
cache.cacheTopCaoThuVin   = redis
# 2026-05-07: Wave 2 batch A — ThanhDuTX lock-pattern port (SUN-1248)
cache.cacheWinThanhDuTX = redis
cache.cacheLossThanhDuTX = redis
# 2026-05-07: Wave 2 batch B — ThanhDuOU lock-pattern port (SUN-1248)
cache.cacheWinThanhDuOU = redis
cache.cacheLossThanhDuOU = redis
# 2026-05-07: Wave 2 batch C — dailyQuestCache lock-pattern port (SUN-1248)
cache.dailyQuestCache    = redis
# 2026-05-07: Wave 2 batch D — cacheBroadcast lock-pattern port (SUN-1248)
cache.cacheBroadcast = redis
# 2026-05-07: Wave 2 batch E — cacheToiChonCa lock-pattern port (SUN-1248)
cache.cacheToiChonCa = redis
# 2026-05-07: Wave 2 batch F — cacheRutLoc (TX/OU/MD5) lock-pattern port (SUN-1248)
cache.cacheRutLocTX = redis
cache.cacheRutLocOU = redis
# 2026-05-07: Wave 2 batch G — cacheEventVpBonus lock-pattern port (SUN-1248)
cache.cacheEventVpBonus = redis
# 2026-05-07: Wave 2 batch H — cacheApiOtp atomic-remove rewrite (SUN-1248)
# Note: this port COLLAPSES the lock entirely via DistCache.remove() returning prior value.
cache.cacheApiOtp = redis
# 2026-05-07: Wave 2 batch I — huGameBai jackpot pot port (SUN-1248)
# FINAL Wave 2 task. Drops Hazelcast TransactionContext (users/freeze
