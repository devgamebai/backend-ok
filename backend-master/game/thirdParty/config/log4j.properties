# Root logger option
log4j.logger.thirdPart=DEBUG, thirdPart
log4j.appender.thirdPart=org.apache.log4j.DailyRollingFileAppender
log4j.appender.thirdPart.layout=org.apache.log4j.PatternLayout
log4j.appender.thirdPart.File=logs/thirdPart/thirdPart.log
log4j.appender.thirdPart.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} | %-5p | %t | %c{3} %m%n
log4j.appender.thirdPart.Encoding=UTF-8
log4j.appender.thirdPart.DatePattern='.'yyyy-MM-dd

log4j.logger.api=DEBUG, api
log4j.appender.api=org.apache.log4j.DailyRollingFileAppender
log4j.appender.api.layout=org.apache.log4j.PatternLayout
log4j.appender.api.File=logs/thirdPart/api.log
log4j.appender.api.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} | %-5p | %t | %c{3} %m%n
log4j.appender.api.Encoding=UTF-8
log4j.appender.api.DatePattern='.'yyyy-MM-dd

log4j.logger.hook=DEBUG, hook
log4j.appender.hook=org.apache.log4j.DailyRollingFileAppender
log4j.appender.hook.layout=org.apache.log4j.PatternLayout
log4j.appender.hook.File=logs/thirdPart/hook.log
log4j.appender.hook.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} | %-5p | %t | %c{3} %m%n
log4j.appender.hook.Encoding=UTF-8
log4j.appender.hook.DatePattern='.'yyyy-MM-dd

log4j.logger.report=INFO, report
log4j.appender.report=org.apache.log4j.DailyRollingFileAppender
log4j.appender.report.layout=org.apache.log4j.PatternLayout
log4j.appender.report.File=logs/thirdPart/report.log
log4j.appender.report.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} | %-5p | %t | %c{3} %m%n
log4j.appender.report.Encoding=UTF-8
log4j.appender.report.DatePattern='.'yyyy-MM-dd

#user core
log4j.logger.user_core=DEBUG, user_core
log4j.appender.user_core=org.apache.log4j.DailyRollingFileAppender
log4j.appender.user_core.layout=org.apache.log4j.PatternLayout
log4j.appender.user_core.File=logs/thirdPart/user_core/user_core.log
log4j.appender.user_core.layout.ConversionPattern=%d{dd MMM yyyy, HH:mm:ss,SSS} %m%n
log4j.appender.user_core.Encoding=UTF-8
log4j.appender.user_core.DatePattern='.'yyyy-MM-dd

log4j.logger.org.mongodb.driver=INFO
log4j.logger.snaq.db=INFO
log4j.logger.org.eclipse.jetty=INFO
