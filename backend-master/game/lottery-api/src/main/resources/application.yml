# lottery-api — Spring Boot config (PR-3/3)
#
# Ports per docs/plans/lottery-extraction-plan.md §1.3:
#   9292 = REST  (HTTP)
#   9293 = STOMP (WebSocket /ws/lottery) — also management actuator port
#
# Both servers run in-process on the same Boot context. STOMP uses the
# servlet WebSocket adapter so it shares the 9292 listener — port 9293 is
# documented as the internal-tooling port for the management endpoints.
#
# CRITICAL: TZ pinning is enforced at the Java level (LotteryClock.VN +
# @Scheduled(zone="Asia/Ho_Chi_Minh")). The JVM default zone stays
# Asia/Seoul (.env:62 TZ) — this app reads Vietnam wall time only via the
# explicit ZoneId.

server:
  port: 9292
  servlet:
    context-path: /

spring:
  application:
    name: lottery-api
  main:
    # The Boot app starts as a daemon thread under the BitZero ServerReadyTask
    # — it must not register a shutdown hook of its own (BitZero already owns
    # the JVM lifecycle).
    register-shutdown-hook: false
    # Allow re-bootstrapping in tests.
    allow-bean-definition-overriding: true
  security:
    user:
      # Default admin credentials are NEVER used — the AccessTokenFilter
      # always runs first and short-circuits the form-login path. We
      # disable form-login in SecurityConfig.
      name: disabled
      password: disabled

management:
  server:
    port: 9293
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.sunwinkr.lottery: INFO
    org.springframework.security: WARN
