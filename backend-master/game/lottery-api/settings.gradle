// Standalone settings for lottery-api.
// Built with Gradle 7.6.4 (/opt/gradle-7.6.4/bin/gradle) because
// Spring Boot 2.7.18 plugin requires Gradle 6.8+ while the parent
// project uses Gradle 5.2.1.
//
// Upstream modules are resolved as pre-built JARs from the parent
// Gradle 5.2.1 build (game/lottery-engine + shared libs).
// Run: cd game/lottery-api && /opt/gradle-7.6.4/bin/gradle test bootJar
//
// CRITICAL: This module pins ZoneId.of("Asia/Ho_Chi_Minh") via
// LotteryClock.VN + @Scheduled(zone="Asia/Ho_Chi_Minh"). Global
// TZ=Asia/Seoul stays untouched.

rootProject.name = 'lottery-api'
