plugins {
    id 'java'
}

group 'backend'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'
    compile project(':VbeeCommon')
    compile project(':VinPlayDAL')
    compile project(':BitzeroAll')
    compile 'com.sendgrid:sendgrid-java:4.4.1'
    compile 'org.jsoup:jsoup:1.15.4'
    compile 'commons-httpclient:commons-httpclient:3.1'
    compile 'org.apache.logging.log4j:log4j-api:2.20.0'
    compile 'com.twilio.sdk:twilio:8.36.0'
    compile 'com.google.firebase:firebase-admin:9.2.0'
}
