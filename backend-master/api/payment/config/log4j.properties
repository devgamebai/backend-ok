# Root logger option
log4j.rootLogger=DEBUG, payment
log4j.appender.payment=org.apache.log4j.DailyRollingFileAppender
log4j.appender.payment.layout=org.apache.log4j.PatternLayout
log4j.appender.payment.File=logs/payment/payment.log
log4j.appender.payment.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} | %-5p | %t | %c{3} %m%n
log4j.appender.payment.Encoding=UTF-8
log4j.appender.payment.DatePattern='.'yyyy-MM-dd

log4j.logger.org.mongodb.driver=INFO
log4j.logger.snaq.db=INFO
log4j.logger.org.eclipse.jetty=INFO

