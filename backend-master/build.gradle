allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    version = '1.0'
    sourceCompatibility = 1.8
    compileJava.options.encoding = 'UTF-8'

    // Exclude real log4j from ALL transitive deps (replaced by log4j-over-slf4j bridge)
    configurations.all {
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'org.slf4j', module: 'slf4j-reload4j'
    }

    dependencies {
        // Dependencies previously in flat java-libs/ that are missing from git
        compile 'com.hazelcast:hazelcast-client:3.12.13'
        // SUN-1248: Lettuce for the Hazelcast→Redis cache migration
        // (docs/architecture/HAZELCAST_TO_REDIS_PLAN.md). 5.3.x is the
        // last JDK 8 line; 6.x requires JDK 11. Pinned until Hazelcast
        // is removed and we drop JDK 8.
        compile 'io.lettuce:lettuce-core:5.3.7.RELEASE'
        compile 'io.netty:netty-all:4.1.94.Final'  // Lettuce transitive — pin to avoid old netty:3.10 conflict
        compile 'io.projectreactor:reactor-core:3.3.22.RELEASE'  // Lettuce transitive
        // Logback (replaces Log4j 1.x) — log4j-over-slf4j bridges existing log4j API calls
        compile 'ch.qos.logback:logback-classic:1.2.12'  // JDK 8 compatible
        compile 'ch.qos.logback:logback-core:1.2.12'
        compile 'org.slf4j:log4j-over-slf4j:1.7.36'      // bridges log4j 1.x → SLF4J → Logback
        compile 'com.fasterxml.jackson.core:jackson-core:2.13.5'
        compile 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
        compile 'com.fasterxml.jackson.core:jackson-annotations:2.13.5'
        compile 'com.rabbitmq:amqp-client:5.16.0'
        compile 'io.lettuce:lettuce-core:6.5.5.RELEASE'
        compile 'net.snaq:dbpool:7.0.1'   // legacy — kept for any residual references
        compile 'com.zaxxer:HikariCP-java7:2.4.13'  // SUN-932: modern pool with validation + leak detection
        compile 'mysql:mysql-connector-java:8.0.33'
        compile 'org.mongodb:mongo-java-driver:3.12.14'
        compile 'org.eclipse.jetty:jetty-server:9.4.51.v20230217'
        compile 'org.eclipse.jetty:jetty-servlet:9.4.51.v20230217'
        compile 'org.eclipse.jetty:jetty-webapp:9.4.51.v20230217'
        compile 'org.eclipse.jetty.websocket:websocket-server:9.4.51.v20230217'
        compile 'org.eclipse.jetty.websocket:websocket-api:9.4.51.v20230217'
        compile 'javax.servlet:javax.servlet-api:4.0.1'
        compile 'org.json:json:20230618'
        compile 'org.apache.commons:commons-lang3:3.12.0'
        compile 'commons-lang:commons-lang:2.6'
        compile 'commons-io:commons-io:2.11.0'
        compile 'org.apache.httpcomponents:httpclient:4.5.14'
        compile 'io.netty:netty:3.10.6.Final'
        compile 'com.thoughtworks.xstream:xstream:1.4.20'
        compile 'joda-time:joda-time:2.12.5'
        compile 'com.google.code.gson:gson:2.9.0'
        compile 'net.sf.json-lib:json-lib:2.4:jdk15'
        compile 'commons-codec:commons-codec:1.15'
        compile 'net.spy:spymemcached:2.12.3'
        compile 'com.cloudhopper.proxool:proxool:0.9.1'
        compile 'com.googlecode.json-simple:json-simple:1.1.1'
        compile 'com.github.pengrad:java-telegram-bot-api:5.0.1'
        compile 'org.apache.axis:axis:1.4'
        compile 'javax.xml.rpc:javax.xml.rpc-api:1.1.2'
        compile 'wsdl4j:wsdl4j:1.6.3'
        compile 'commons-discovery:commons-discovery:0.5'
        compile 'org.bouncycastle:bcprov-jdk15on:1.70'
        compile 'com.github.cage:cage:1.0'
        compile 'org.apache.thrift:libthrift:0.14.2'
        compile 'org.scala-lang:scala-library:2.12.18'
        compile 'org.slf4j:slf4j-api:1.7.36'
        // compile 'org.slf4j:slf4j-log4j12:1.7.36'  // removed — conflicts with log4j-over-slf4j
    }
}
task copyRuntimeDeps(type: Copy) {
    into "runtime-libs"
    subprojects.each { subproject ->
        subproject.afterEvaluate {
            if (subproject.plugins.hasPlugin("java")) {
                from subproject.configurations.runtimeClasspath
            }
        }
    }
}

// SUN-748 / SUN-753 safety check: forbid reintroduction of the
// `getCurrentMoney(String)` / `setCurrentMoney(String, long)` trap methods.
// Runs on every `gradle build` of any subproject by piggybacking the shared
// VbeeCommon compile (which every subproject depends on, directly or via
// VinPlayUserCore). Any build therefore runs this check at least once.
task checkNoCurrentMoneyTrap(type: Exec) {
    description 'Forbid reintroduction of the SUN-748 vin_total/vin naming trap'
    group 'verification'
    commandLine 'bash', file('scripts/check-no-currentmoney-trap.sh').absolutePath
}

// Make every subproject's compileJava depend on the trap check, so any
// build path exercises the guard.
subprojects {
    afterEvaluate { proj ->
        if (proj.tasks.findByName('compileJava') != null) {
            proj.tasks.named('compileJava').configure {
                dependsOn ':checkNoCurrentMoneyTrap'
            }
        }
    }
}
